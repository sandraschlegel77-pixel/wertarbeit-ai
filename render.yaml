# Render.com Blueprint (Primary Server 1 — 24/7-Hosting, Render Free Web Service).
# Geheimnisse (sync: false) im Render-Dashboard eintragen.
# Hinweis: Render Free hat keine persistente Disk. App-Datenbank extern über DATABASE_URL
# (PostgreSQL/Neon/Supabase) oder TURSO_DATABASE_URL anbinden; App-Dateien auf dem
# Render-Dateisystem sind flüchtig.
services:
  - type: web
    name: aetherion-omega-x18-primary
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: OWNER_SHOP_DOMAIN
        value: wertarbeitmanufaktur.myshopify.com
      - key: DRY_RUN_MODE
        value: "true"
      - key: BILLING_LIVE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: MOBILE_MONITOR_TOKEN
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false