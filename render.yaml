# Render.com Blueprint (24/7-Hosting). Geheimnisse (sync: false) trägst du im Render-Dashboard ein.
# Hinweis Kosten: Der Free-Plan schläft nach Inaktivität ein und hat KEINE persistente Disk –
# der Cron-Ping (cron-job.org alle 5 Min. auf /api/cron) hält ihn wach, SQLite-Daten gehen dort aber bei
# jedem Neustart verloren. Für dauerhafte Daten: Neon-PostgreSQL (Gratis) oder bezahlter Plan mit Disk.
services:
  - type: web
    name: atelierpilot-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /privacy
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: OWNER_SHOP_DOMAIN
        value: wertarbeitmanufaktur.myshopify.com
      - key: DRY_RUN_MODE
        value: "true"
      - key: BILLING_LIVE
        value: "false"
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: MOBILE_MONITOR_TOKEN
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEY
        sync: false
