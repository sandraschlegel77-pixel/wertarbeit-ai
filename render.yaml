# Render.com Blueprint (24/7-Hosting). Geheimnisse (sync: false) trägst du im Render-Dashboard ein.
# Hinweis: Render Free hat keine persistente Disk. App-Datenbank daher extern über DATABASE_URL
# anbinden (z. B. PostgreSQL); die App-Dateien auf dem Render-Dateisystem sind flüchtig.
services:
  - type: web
    name: atelierpilot-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /privacy
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: OWNER_SHOP_DOMAIN
        value: wertarbeitmanufaktur.myshopify.com
      - key: DRY_RUN_MODE
        value: "true"
      - key: BILLING_LIVE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: MOBILE_MONITOR_TOKEN
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEY
        sync: false
