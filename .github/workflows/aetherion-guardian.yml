      - name: 4. Telegram-Statusbericht & RESCUE-112 Alarm senden
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIMARY_STATUS: ${{ steps.health.outputs.primary }}
          BACKUP1_STATUS: ${{ steps.health.outputs.backup1 }}
          EDGE_STATUS: ${{ steps.health.outputs.edge }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.parse

          token = (os.environ.get("BOT_TOKEN") or "").strip()
          if token.lower().startswith("bot"):
              token = token[3:]
          chat_id = (os.environ.get("CHAT_ID") or "").strip()
          p = os.environ.get("PRIMARY_STATUS", "000")
          b1 = os.environ.get("BACKUP1_STATUS", "000")
          e = os.environ.get("EDGE_STATUS", "000")

          if not token or not chat_id:
              raise SystemExit("Fehlender TELEGRAM_BOT_TOKEN oder TELEGRAM_CHAT_ID in GitHub Secrets.")

          if p != "200" or e != "200":
              msg = (
                  f"🚨 RESCUE-112 ALARM // AETHERION OMEGA\n"
                  f"Primary (Render): {p}\n"
                  f"Backup 1 (Vercel): {b1}\n"
                  f"Edge-Router: {e}"
              )
          else:
              msg = (
                  f"✅ AETHERION NIGHTLY GUARDIAN OK\n"
                  f"Primary (Render): 200\n"
                  f"Backup 1 (Vercel): {b1}\n"
                  f"Edge-Router: 200\n"
                  f"Datenbank-Backup: Gesichert"
              )

          url = f"https://telegram.org{token}/sendMessage"
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode("utf-8")
          req = urllib.request.Request(url, data=data, method="POST")
          with urllib.request.urlopen(req, timeout=15) as resp:
              print("Telegram HTTP Status:", resp.status)
          EOF
