# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c8f10f33ad9d8826b4f60c6239df53e5"
name = "AtelierPilot AI"
application_url = "https://example.com"
embedded = true

api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_orders,write_orders,read_inventory,write_inventory,read_analytics,write_reports,read_content,write_content,read_discounts,write_discounts,read_fulfillments,write_fulfillments,read_locations,read_metaobjects,write_metaobjects,read_publications,write_publications,read_shipping,write_returns,write_returns,read_files,write_files,read_translations,write_translations"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[product.metafields.app.material]
type = "single_line_text_field"
name = "Material"
description = "Verifizierte Materialangabe für AtelierPilot Marketplace-Feeds"

  [product.metafields.app.material.access]
  admin = "merchant_read_write"

[product.metafields.app.lucid_packaging_weight_g]
type = "number_decimal"
name = "LUCID-Verpackungsgewicht (g)"
description = "Verpackungsgewicht pro Verkaufseinheit in Gramm; keine Produktmasse"

  [product.metafields.app.lucid_packaging_weight_g.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "products/create", "products/update", "products/delete", "inventory_levels/update", "orders/create", "orders/paid", "checkouts/update", "orders/cancelled", "refunds/create", "app/uninstalled" ]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[sidekick]
extensions_summary = "AtelierPilot Sidekick Tools: 20 KI-Endpunkte für Brand-DNA, Auto-Listing, Multichannel-Sync, GRA-Zertifikate, Rechnungen, Concierge und Support."

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true

